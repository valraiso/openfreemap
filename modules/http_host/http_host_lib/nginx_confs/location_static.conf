location /fonts/ {
    # trailing slash

    alias /data/ofm/http_host/assets/fonts/ofm/; # trailing slash
    try_files $uri =404;

    expires 1w;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

}

location /natural_earth/ {
    # trailing slash

    alias /data/ofm/http_host/assets/natural_earth/ofm/; # trailing slash
    try_files $uri =404;

    expires 10y;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

}

location /sprites/ {
    # trailing slash

    alias /data/ofm/http_host/assets/sprites/; # trailing slash
    try_files $uri =404;

    expires 10y;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

}


# custom tile datasets, deposited externally in /data/ofm/http_host/tiles/{dataset}/
# generic regex locations: adding a dataset requires no nginx reload

# TileJSON, served if the dataset ships a tilejson.json at its root
location ~ ^/tiles/([^/]+)$ {
    root /data/ofm/http_host/tiles; # no trailing slash
    try_files /$1/tilejson.json =404;

    expires 1d;
    default_type application/json;

    # substitute the domain in the TileJSON
    sub_filter '__TILEJSON_DOMAIN__' '__DOMAIN__';
    sub_filter_once off;
    sub_filter_types '*';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header x-ofm-debug 'custom dataset TileJSON';
}

# PBF tiles; datasets are immutable (version in the dataset name), hence the long cache
# the z/x/y pattern is strict so tilejson.json can never be served gzip-labeled
location ~ ^/tiles/([^/]+)/(\d+/\d+/\d+\.pbf)$ {
    root /data/ofm/http_host/tiles; # no trailing slash
    try_files /$1/$2 @empty_tile;
    add_header Content-Encoding gzip;

    expires 10y;

    types {
        application/vnd.mapbox-vector-tile pbf;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header x-ofm-debug 'custom dataset PBF';
}

# raster tiles; served as-is (already-compressed image formats, no gzip),
# MIME type comes from the standard mime.types mapping
# missing raster tile is a 404: an empty 200 would be an image decode error client-side
location ~ ^/tiles/([^/]+)/(\d+/\d+/\d+\.(?:webp|png|jpg|jpeg|avif))$ {
    root /data/ofm/http_host/tiles; # no trailing slash
    try_files /$1/$2 =404;

    expires 10y;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header x-ofm-debug 'custom dataset raster';
}


# we need to handle missing tiles as valid request returning empty string
location @empty_tile {
    return 200 '';

    expires 10y;

    types {
        application/vnd.mapbox-vector-tile pbf;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header x-ofm-debug 'empty tile';
}

location = / {
    return 302 https://openfreemap.org;
}
